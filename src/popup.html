<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LinkedIn Job Sheet</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <label for="country">Country</label>
    <select id="country">
      <option value="Brazil">Brazil</option>
      <option value="Argentina" selected>Argentina</option>
      <option value="Colombia">Colombia</option>
      <option value="Dominican Republic">Dominican Republic</option>
      <option value="Other">Other</option>
    </select>
    <p id="current">Current country: Argentina</p>
    <p class="hint">Press Space, then M, to add this page. Hold Shift while pressing M to pick a country first.</p>
    <button id="open-options" type="button">Options</button>
    <script src="../dist/popup.js"></script>
  </body>
</html>
